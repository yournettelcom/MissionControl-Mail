<VirtualHost *:80>
    ServerAdmin admin@mail.example.com
    ServerName mail.example.com
    DocumentRoot /opt/missioncontrol/frontend
    <Directory /opt/missioncontrol/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/missioncontrol-error.log
    CustomLog ${APACHE_LOG_DIR}/missioncontrol-access.log combined
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache, no-store, must-revalidate, private"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </FilesMatch>
    <FilesMatch "\.(js|css|svg|png|jpg|ico|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <Location /api>
        ProxyPass http://127.0.0.1:8000/api
        ProxyPassReverse http://127.0.0.1:8000/api
    </Location>
    <Location /api/v1/mail/ws>
        ProxyPass ws://127.0.0.1:8000/api/v1/mail/ws
        ProxyPassReverse ws://127.0.0.1:8000/api/v1/mail/ws
    </Location>
    <Location /docs>
        ProxyPass http://127.0.0.1:8000/docs
        ProxyPassReverse http://127.0.0.1:8000/docs
    </Location>
    <Location /openapi.json>
        ProxyPass http://127.0.0.1:8000/openapi.json
        ProxyPassReverse http://127.0.0.1:8000/openapi.json
    </Location>
    FallbackResource /index.html
    Header set Access-Control-Allow-Origin "*"
    Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header set Access-Control-Allow-Headers "Authorization, Content-Type"
    Header set X-Content-Type-Options "nosniff"
</VirtualHost>
