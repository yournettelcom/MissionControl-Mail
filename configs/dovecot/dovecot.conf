protocols = imap pop3 lmtp
listen = *, ::
mail_location = maildir:/var/vmail/%d/%n
first_valid_uid = 5000
last_valid_uid = 5000

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

# ─── Include all standard configs ──────────────────────────────────────
!include_try /etc/dovecot/conf.d/*.conf
